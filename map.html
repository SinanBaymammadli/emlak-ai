<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emlak AI — Xəritə</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9/dist/leaflet.js"></script>
  <style>
    body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    .map-controls {
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
      padding: 10px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
    }
    .map-stats { font-size: .78rem; color: #6b7280; white-space: nowrap; }

    .view-toggle {
      display: flex; gap: 4px; margin-left: auto;
    }
    .view-btn {
      padding: 5px 14px;
      border-radius: 7px;
      border: 1.5px solid #d1d5db;
      background: #fff;
      font-size: .78rem;
      cursor: pointer;
      font-weight: 500;
      color: #374151;
      transition: all .15s;
    }
    .view-btn.active { background: #6366f1; border-color: #6366f1; color: #fff; }

    #map { flex: 1; width: 100%; }

    /* Popup */
    .popup-photo { width: 200px; height: 130px; object-fit: cover; border-radius: 6px; margin-bottom: 8px; display: block; }
    .popup-price { font-size: 1rem; font-weight: 700; color: #1a1a2e; }
    .popup-ppm2  { font-size: .75rem; color: #6366f1; font-weight: 600; }
    .popup-loc   { font-size: .78rem; color: #4b5563; margin-top: 3px; }
    .popup-det   { font-size: .75rem; color: #6b7280; margin-top: 2px; }
    .popup-badge { display: inline-block; font-size: .65rem; font-weight: 600; padding: 1px 7px; border-radius: 999px; margin-top: 4px; }
    .popup-agency { background: #fef3c7; color: #b45309; }
    .popup-owner  { background: #dcfce7; color: #15803d; }
    .popup-link { display: block; margin-top: 8px; font-size: .78rem; color: #6366f1; text-decoration: none; }
    .popup-link:hover { text-decoration: underline; }

    /* Marker legend */
    .map-legend {
      position: absolute; bottom: 24px; right: 10px; z-index: 1000;
      background: #fff; border-radius: 8px; padding: 10px 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
      font-size: .75rem; color: #374151;
    }
    .legend-item { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
    .legend-item:last-child { margin-bottom: 0; }
    .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }

    /* Choropleth legend */
    .choropleth-legend {
      position: absolute; bottom: 24px; right: 10px; z-index: 1000;
      background: #fff; border-radius: 8px; padding: 10px 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
      font-size: .75rem; color: #374151;
      display: none;
    }
    .choropleth-legend.visible { display: block; }
    .choropleth-legend-title { font-weight: 700; margin-bottom: 6px; }
    .choro-item { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .choro-swatch { width: 20px; height: 12px; border-radius: 2px; flex-shrink: 0; border: 1px solid rgba(0,0,0,.1); }

    /* District tooltip */
    .district-tooltip {
      background: rgba(26,26,46,.88);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: .78rem;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
  </style>
</head>
<body>

<header>
  <h1>Emlak <span>AI</span></h1>
  <nav class="header-nav">
    <a href="index.html" class="nav-link">Elanlar</a>
    <a href="analytics.html" class="nav-link">Analitika</a>
    <a href="map.html" class="nav-link active">Xəritə</a>
  </nav>
</header>

<div class="map-controls">
  <div class="chips" id="cat-chips">
    <button class="chip active" data-cat="all">Hamısı</button>
    <button class="chip" data-cat="apartment">Mənzil</button>
    <button class="chip" data-cat="house">Həyət evi</button>
    <button class="chip" data-cat="land">Torpaq</button>
    <button class="chip" data-cat="commercial">Kommersiya</button>
    <button class="chip" data-cat="office">Ofis</button>
    <button class="chip" data-cat="garage">Qaraj</button>
  </div>
  <div class="chips" id="type-chips">
    <button class="chip active" data-type="all">Satış + Kirayə</button>
    <button class="chip" data-type="sale">Satış</button>
    <button class="chip" data-type="rental">Kirayə</button>
  </div>
  <div class="filters" style="margin:2px 0">
    <div class="ms-wrap" id="m-ms-wrap">
      <button class="ms-btn" id="m-ms-btn"><span id="m-ms-label">Bütün məkanlar</span><span class="ms-caret">▼</span></button>
      <div class="ms-dropdown" id="m-ms-dropdown">
        <input class="ms-search" id="m-ms-search" placeholder="Axtar…" autocomplete="off">
        <div class="ms-actions"><button id="m-ms-all">Hamısını seç</button><button id="m-ms-none">Sıfırla</button></div>
        <div class="ms-list" id="m-ms-list"></div>
      </div>
    </div>
    <div class="filter-group"><span class="filter-label">Qiymət:</span><input type="number" id="m-pmin" placeholder="Min ₼" style="width:80px"><span class="sep">–</span><input type="number" id="m-pmax" placeholder="Max ₼" style="width:80px"></div>
    <div class="filter-group"><span class="filter-label">Sahə:</span><input type="number" id="m-amin" placeholder="Min m²" style="width:70px"><span class="sep">–</span><input type="number" id="m-amax" placeholder="Max m²" style="width:70px"></div>
    <div class="filter-group"><span class="filter-label">₼/m²:</span><input type="number" id="m-mmin" placeholder="Min" style="width:65px"><span class="sep">–</span><input type="number" id="m-mmax" placeholder="Max" style="width:65px"></div>
    <div class="filter-group"><span class="filter-label">Otaq:</span><select id="m-rooms"><option value="">Hamısı</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5+</option></select></div>
    <div class="filter-group"><span class="filter-label">Təmir:</span><select id="m-repair"><option value="">Hamısı</option><option value="yes">Var</option><option value="no">Yox</option></select></div>
    <div class="filter-group"><span class="filter-label">Elan sahibi:</span><select id="m-agency"><option value="">Hamısı</option><option value="owner">Mülkiyyətçi</option><option value="agency">Agentlik</option></select></div>
  </div>
  <span class="map-stats" id="map-stats">Yüklənir…</span>
  <div class="view-toggle">
    <button class="view-btn active" id="btn-markers">Markerlər</button>
    <button class="view-btn" id="btn-choropleth">Qiymət xəritəsi</button>
  </div>
</div>

<div id="map"></div>

<!-- Marker legend -->
<div class="map-legend" id="marker-legend">
  <div class="legend-item"><div class="legend-dot" style="background:#6366f1"></div> Mənzil</div>
  <div class="legend-item"><div class="legend-dot" style="background:#4ade80"></div> Həyət evi</div>
  <div class="legend-item"><div class="legend-dot" style="background:#f59e0b"></div> Torpaq</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ef4444"></div> Kommersiya</div>
  <div class="legend-item"><div class="legend-dot" style="background:#06b6d4"></div> Ofis</div>
  <div class="legend-item"><div class="legend-dot" style="background:#8b5cf6"></div> Qaraj</div>
</div>

<!-- Choropleth legend (hidden by default) -->
<div class="choropleth-legend" id="choropleth-legend">
  <div class="choropleth-legend-title">Orta ₼/m²</div>
  <div class="choro-item"><div class="choro-swatch" style="background:#dcfce7"></div><span id="choro-l1">—</span></div>
  <div class="choro-item"><div class="choro-swatch" style="background:#86efac"></div><span id="choro-l2">—</span></div>
  <div class="choro-item"><div class="choro-swatch" style="background:#fef08a"></div><span id="choro-l3">—</span></div>
  <div class="choro-item"><div class="choro-swatch" style="background:#fdba74"></div><span id="choro-l4">—</span></div>
  <div class="choro-item"><div class="choro-swatch" style="background:#f87171"></div><span id="choro-l5">—</span></div>
  <div class="choro-item"><div class="choro-swatch" style="background:#e5e7eb"></div><span>Məlumat yoxdur</span></div>
</div>

<script>
const CAT_COLORS = {
  apartment: '#6366f1', house: '#4ade80', land: '#f59e0b',
  commercial: '#ef4444', office: '#06b6d4', garage: '#8b5cf6',
};
const FILES = {
  apartment: ['sale','rental'], house: ['sale','rental'],
  land: ['sale'], commercial: ['sale','rental'],
  office: ['sale','rental'], garage: ['sale','rental'],
};
const CHORO_COLORS = ['#dcfce7','#86efac','#fef08a','#fdba74','#f87171'];

function fmt(n) { return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
function ppm2(l) {
  const a = typeof l.area_m2 === 'number' ? l.area_m2 : parseFloat(String(l.area_m2||'').match(/[\d.]+/)?.[0]);
  if (!l.price || !a || a <= 0) return null;
  return l.price / a;
}
function formatPrice(p, dt) { return dt === 'rental' ? `${fmt(p)} ₼/ay` : `${fmt(p)} ₼`; }

// Normalize district name for fuzzy matching
function normName(s) {
  return (s || '').toLowerCase()
    .replace(/rayonu?/g, '').replace(/\br\./g, '')
    .replace(/nəriman\s+nərimanov/g, 'nərimanov')
    .replace(/[^a-zəığüöçşı]/g, ' ')
    .trim().replace(/\s+/g, ' ');
}

// Init map
const map = L.map('map').setView([40.4093, 49.8671], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap', maxZoom: 19,
}).addTo(map);

const cache = {};
async function loadFile(cat, type) {
  const key = `${cat}_${type}`;
  if (cache[key]) return cache[key];
  try {
    const res = await fetch(`data/${key}.json`);
    cache[key] = res.ok ? await res.json() : [];
  } catch { cache[key] = []; }
  return cache[key];
}

let allListings = [];
let selCat = 'all', selType = 'all';
let selLocs = new Set();
let mPriceMin = null, mPriceMax = null, mAreaMin = null, mAreaMax = null;
let mPpm2Min = null, mPpm2Max = null, mRooms = '', mRepair = '', mAgency = '';
let viewMode = 'markers'; // 'markers' | 'choropleth'
let markerLayer = L.layerGroup().addTo(map);
let choroLayer = null;
let districtGeoJson = null;

// ── Load data ─────────────────────────────────────────────────────────────────
async function loadAll() {
  const pairs = [];
  Object.entries(FILES).forEach(([c, types]) => types.forEach(t => pairs.push([c, t])));
  const [listingsArr, geoJsonData] = await Promise.all([
    Promise.all(pairs.map(([c,t]) => loadFile(c,t))).then(r => r.flat()),
    fetch('districts.geojson').then(r => r.ok ? r.json() : null).catch(() => null),
  ]);
  allListings = listingsArr;
  districtGeoJson = geoJsonData;
  buildMapLocDropdown();
  render();
}

// ── Choropleth helpers ────────────────────────────────────────────────────────
function computeDistrictPpm2(listings) {
  // Build map: normalised district name → [ppm2 values]
  const buckets = {};
  listings.forEach(l => {
    const v = ppm2(l);
    if (!v) return;
    const key = normName(l.location_name || l.location);
    if (!key) return;
    if (!buckets[key]) buckets[key] = [];
    buckets[key].push(v);
  });
  const avgs = {};
  Object.entries(buckets).forEach(([k, vals]) => {
    if (vals.length >= 2) avgs[k] = vals.reduce((a,b) => a+b, 0) / vals.length;
  });
  return avgs;
}

function quintileColor(value, sorted) {
  if (!value || !sorted.length) return '#e5e7eb';
  const pct = sorted.filter(v => v <= value).length / sorted.length;
  if (pct <= 0.2) return CHORO_COLORS[0];
  if (pct <= 0.4) return CHORO_COLORS[1];
  if (pct <= 0.6) return CHORO_COLORS[2];
  if (pct <= 0.8) return CHORO_COLORS[3];
  return CHORO_COLORS[4];
}

function matchDistrict(featureName, districtAvgs) {
  const fn = normName(featureName);
  // Exact match
  if (districtAvgs[fn] !== undefined) return districtAvgs[fn];
  // Partial match
  for (const [key, val] of Object.entries(districtAvgs)) {
    if (fn.includes(key) || key.includes(fn)) return val;
  }
  return null;
}

function buildChoroLayer(listings) {
  if (!districtGeoJson) return null;

  const active = listings.filter(l => !l.deleted_at);
  const districtAvgs = computeDistrictPpm2(active);
  const sortedVals = Object.values(districtAvgs).sort((a,b) => a-b);

  // Update legend labels
  const q = (p) => {
    const idx = Math.floor(p * sortedVals.length);
    return sortedVals[Math.min(idx, sortedVals.length - 1)];
  };
  if (sortedVals.length >= 5) {
    document.getElementById('choro-l1').textContent = `≤ ${fmt(q(0.2))} ₼/m²`;
    document.getElementById('choro-l2').textContent = `≤ ${fmt(q(0.4))} ₼/m²`;
    document.getElementById('choro-l3').textContent = `≤ ${fmt(q(0.6))} ₼/m²`;
    document.getElementById('choro-l4').textContent = `≤ ${fmt(q(0.8))} ₼/m²`;
    document.getElementById('choro-l5').textContent = `> ${fmt(q(0.8))} ₼/m²`;
  }

  return L.geoJSON(districtGeoJson, {
    style: (feature) => {
      const avg = matchDistrict(feature.properties.name, districtAvgs);
      return {
        fillColor: avg ? quintileColor(avg, sortedVals) : '#e5e7eb',
        fillOpacity: 0.65,
        color: '#94a3b8',
        weight: 1.5,
      };
    },
    onEachFeature: (feature, layer) => {
      const avg = matchDistrict(feature.properties.name, districtAvgs);
      const label = avg
        ? `<b>${feature.properties.name}</b><br>Orta ₼/m²: ${fmt(avg)} ₼`
        : `<b>${feature.properties.name}</b><br>Məlumat yoxdur`;

      layer.on({
        mouseover: (e) => {
          e.target.setStyle({ fillOpacity: 0.85, weight: 2.5, color: '#1a1a2e' });
          layer.bindTooltip(label, { className: 'district-tooltip', sticky: true }).openTooltip(e.latlng);
        },
        mouseout: (e) => {
          choroLayer.resetStyle(e.target);
          layer.closeTooltip();
        },
      });
    },
  });
}

// ── Render ────────────────────────────────────────────────────────────────────
function numV(id) { const v = parseFloat(document.getElementById(id)?.value); return isNaN(v) ? null : v; }

function getFilteredListings() {
  mPriceMin = numV('m-pmin'); mPriceMax = numV('m-pmax');
  mAreaMin  = numV('m-amin'); mAreaMax  = numV('m-amax');
  mPpm2Min  = numV('m-mmin'); mPpm2Max  = numV('m-mmax');
  mRooms  = document.getElementById('m-rooms')?.value  || '';
  mRepair = document.getElementById('m-repair')?.value || '';
  mAgency = document.getElementById('m-agency')?.value || '';

  return allListings.filter(l => {
    if (l.deleted_at) return false;
    if (selCat  !== 'all' && l.category  !== selCat)  return false;
    if (selType !== 'all' && l.deal_type !== selType)  return false;
    if (selLocs.size && !selLocs.has(l.location_name || l.location || '')) return false;
    if (mPriceMin != null && (l.price == null || l.price < mPriceMin)) return false;
    if (mPriceMax != null && (l.price == null || l.price > mPriceMax)) return false;
    const a = typeof l.area_m2==='number'?l.area_m2:parseFloat(String(l.area_m2||'').match(/[\d.]+/)?.[0]);
    if (mAreaMin  != null && (a == null || a < mAreaMin)) return false;
    if (mAreaMax  != null && (a == null || a > mAreaMax)) return false;
    const pp = ppm2(l);
    if (mPpm2Min  != null && (pp == null || pp < mPpm2Min)) return false;
    if (mPpm2Max  != null && (pp == null || pp > mPpm2Max)) return false;
    if (mRooms) {
      const rm = String(l.rooms||'').match(/\d+/);
      const n = rm ? parseInt(rm[0]) : null;
      if (mRooms === '5') { if (n == null || n < 5) return false; }
      else if (n !== parseInt(mRooms)) return false;
    }
    if (mRepair === 'yes' && l.has_repair !== true)  return false;
    if (mRepair === 'no'  && l.has_repair !== false) return false;
    if (mAgency === 'agency' && l.is_agency !== true)  return false;
    if (mAgency === 'owner'  && l.is_agency !== false) return false;
    return true;
  });
}

function render() {
  const filtered = getFilteredListings();
  if (viewMode === 'markers') renderMarkers(filtered);
  else renderChoropleth(filtered);
}

function renderMarkers(list) {
  // Remove choropleth
  if (choroLayer) { map.removeLayer(choroLayer); choroLayer = null; }
  document.getElementById('choropleth-legend').classList.remove('visible');
  document.getElementById('marker-legend').style.display = '';

  markerLayer.clearLayers();
  const withCoords = list.filter(l => l.lat != null && l.lng != null);

  withCoords.forEach(l => {
    const color = CAT_COLORS[l.category] || '#6366f1';
    const marker = L.circleMarker([l.lat, l.lng], {
      radius: 7, fillColor: color, fillOpacity: 0.85, color: '#fff', weight: 1.5,
    });
    const m2 = ppm2(l);
    const area = typeof l.area_m2 === 'number' ? l.area_m2
      : parseFloat(String(l.area_m2||'').match(/[\d.]+/)?.[0]) || null;
    const det = [l.rooms, area ? `${area} m²` : '', l.land_area_sot ? `${l.land_area_sot} sot` : '']
      .filter(Boolean).join(' · ');
    const agencyBadge = l.is_agency === true
      ? '<span class="popup-badge popup-agency">Agentlik</span>'
      : l.is_agency === false ? '<span class="popup-badge popup-owner">Mülkiyyətçi</span>' : '';

    marker.bindPopup(`
      ${l.photo_url ? `<img class="popup-photo" src="${l.photo_url}" onerror="this.style.display='none'">` : ''}
      <div class="popup-price">${l.price ? formatPrice(l.price, l.deal_type) : '—'}</div>
      ${m2 ? `<div class="popup-ppm2">${fmt(m2)} ₼/m²</div>` : ''}
      ${l.location ? `<div class="popup-loc">${l.location}</div>` : ''}
      ${det ? `<div class="popup-det">${det}</div>` : ''}
      ${agencyBadge}
      <a class="popup-link" href="${l.url}" target="_blank" rel="noopener">bina.az-da aç →</a>
    `, { maxWidth: 220 });
    markerLayer.addLayer(marker);
  });

  document.getElementById('map-stats').textContent = `${withCoords.length.toLocaleString()} elan xəritədə`;
}

function renderChoropleth(list) {
  // Remove markers
  markerLayer.clearLayers();
  document.getElementById('marker-legend').style.display = 'none';
  document.getElementById('choropleth-legend').classList.add('visible');

  if (choroLayer) { map.removeLayer(choroLayer); choroLayer = null; }
  if (!districtGeoJson) {
    document.getElementById('map-stats').textContent = 'GeoJSON yüklənmədi';
    return;
  }

  choroLayer = buildChoroLayer(list);
  if (choroLayer) choroLayer.addTo(map);

  const withPpm2 = list.filter(l => ppm2(l) !== null);
  document.getElementById('map-stats').textContent = `${list.length.toLocaleString()} elan, ${districtGeoJson.features.length} rayon`;
}

// ── Events ────────────────────────────────────────────────────────────────────
document.getElementById('cat-chips').addEventListener('click', e => {
  const btn = e.target.closest('.chip'); if (!btn) return;
  document.querySelectorAll('#cat-chips .chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  selCat = btn.dataset.cat;
  render();
});
document.getElementById('type-chips').addEventListener('click', e => {
  const btn = e.target.closest('.chip'); if (!btn) return;
  document.querySelectorAll('#type-chips .chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  selType = btn.dataset.type;
  render();
});

// Range + select filters
['m-pmin','m-pmax','m-amin','m-amax','m-mmin','m-mmax'].forEach(id =>
  document.getElementById(id)?.addEventListener('input', render));
['m-rooms','m-repair','m-agency'].forEach(id =>
  document.getElementById(id)?.addEventListener('change', render));

// Location multiselect
const MAP_ALL_LOCATIONS = ['20 Yanvar m.','20-ci sahə q.','28 May m.','9-cu mikrorayon q.','Azadlıq Prospekti m.','Ağ şəhər q.','Badamdar q.','Bakıxanov q.','Bayıl q.','Bilgəh q.','Biləcəri q.','Binə q.','Binəqədi q.','Binəqədi r.','Buzovna q.','Dübəndi q.','Elmlər Akademiyası m.','Görədil q.','Gənclik m.','Hökməli q.','Hövsan q.','Həzi Aslanov m.','Həzi Aslanov q.','Koroğlu m.','Lökbatan q.','M.Ə.Rəsulzadə q.','Masazır q.','Mehdiabad q.','Memar Əcəmi m.','Məmmədli q.','Mərdəkan q.','Nardaran q.','Neftçilər m.','Nizami m.','Nizami r.','Novxanı q.','Nəriman Nərimanov m.','Nərimanov r.','Nəsimi r.','Qala q.','Qara Qarayev m.','Qaraçuxur q.','Qobu q.','Sahil q.','Saray q.','Sea Breeze q.','Türkan q.','Yasamal q.','Yasamal r.','Yeni Ramana q.','Yeni Yasamal q.','Zabrat q.','Zığ q.','İnşaatçılar m.','İçəri Şəhər m.','Şah İsmayıl Xətai m.','Şağan q.','Şüvəlan q.','Əhmədli m.','Ələt q.','Əmircan q.'];

function buildMapLocDropdown(q = '') {
  const el = document.getElementById('m-ms-list'); if (!el) return;
  const fromData = allListings.map(l => l.location_name || l.location || '').filter(Boolean);
  const locs = [...new Set([...MAP_ALL_LOCATIONS, ...fromData])].sort();
  const vis = q ? locs.filter(l => l.toLowerCase().includes(q.toLowerCase())) : locs;
  if (!vis.length) { el.innerHTML = '<div class="ms-empty">Nəticə yoxdur</div>'; return; }
  el.innerHTML = vis.map(loc => `<label class="ms-item"><input type="checkbox" value="${loc.replace(/"/g,'&quot;')}" ${selLocs.has(loc)?'checked':''}><span>${loc}</span></label>`).join('');
  el.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', () => { if (cb.checked) selLocs.add(cb.value); else selLocs.delete(cb.value); updateMapMsLabel(); render(); });
  });
}
function updateMapMsLabel() {
  const btn = document.getElementById('m-ms-btn'); const lbl = document.getElementById('m-ms-label');
  if (!btn || !lbl) return;
  if (selLocs.size === 0) { lbl.textContent = 'Bütün məkanlar'; btn.classList.remove('has-selection'); }
  else { lbl.textContent = `${selLocs.size} məkan seçildi`; btn.classList.add('has-selection'); }
}
document.getElementById('m-ms-btn').addEventListener('click', e => {
  e.stopPropagation();
  document.getElementById('m-ms-dropdown').classList.toggle('open');
  if (document.getElementById('m-ms-dropdown').classList.contains('open')) document.getElementById('m-ms-search').focus();
});
document.addEventListener('click', e => {
  if (!document.getElementById('m-ms-wrap')?.contains(e.target)) document.getElementById('m-ms-dropdown')?.classList.remove('open');
});
document.getElementById('m-ms-search').addEventListener('input', e => buildMapLocDropdown(e.target.value));
document.getElementById('m-ms-all').addEventListener('click', () => {
  allListings.map(l => l.location_name||l.location||'').filter(Boolean).forEach(l => selLocs.add(l));
  buildMapLocDropdown(); updateMapMsLabel(); render();
});
document.getElementById('m-ms-none').addEventListener('click', () => {
  selLocs.clear(); buildMapLocDropdown(); updateMapMsLabel(); render();
});

document.getElementById('btn-markers').addEventListener('click', () => {
  viewMode = 'markers';
  document.getElementById('btn-markers').classList.add('active');
  document.getElementById('btn-choropleth').classList.remove('active');
  render();
});
document.getElementById('btn-choropleth').addEventListener('click', () => {
  viewMode = 'choropleth';
  document.getElementById('btn-choropleth').classList.add('active');
  document.getElementById('btn-markers').classList.remove('active');
  render();
});

// ── URL search param sync ─────────────────────────────────────────────────────

function updateNavLinks() {
  const shared = new URLSearchParams();
  if (selCat  !== 'all') shared.set('cat',  selCat);
  if (selType !== 'all') shared.set('type', selType);
  const str = shared.toString();
  document.querySelectorAll('.nav-link').forEach(a => {
    const base = a.getAttribute('href').split('?')[0];
    a.href = str ? `${base}?${str}` : base;
  });
}

function pushState() {
  const p = new URLSearchParams();
  if (selCat  !== 'all')      p.set('cat',    selCat);
  if (selType !== 'all')      p.set('type',   selType);
  if (viewMode !== 'markers') p.set('view',   viewMode);
  if (selLocs.size)           p.set('locs',   [...selLocs].join('|'));
  if (mPriceMin != null)      p.set('pmin',   mPriceMin);
  if (mPriceMax != null)      p.set('pmax',   mPriceMax);
  if (mAreaMin  != null)      p.set('amin',   mAreaMin);
  if (mAreaMax  != null)      p.set('amax',   mAreaMax);
  if (mPpm2Min  != null)      p.set('mmin',   mPpm2Min);
  if (mPpm2Max  != null)      p.set('mmax',   mPpm2Max);
  if (mRooms)                 p.set('rooms',  mRooms);
  if (mRepair)                p.set('repair', mRepair);
  if (mAgency)                p.set('agency', mAgency);
  const str = p.toString();
  history.replaceState(null, '', str ? `?${str}` : location.pathname);
}

function restoreFromUrl() {
  const p = new URLSearchParams(location.search);
  if (p.has('cat'))  { selCat  = p.get('cat');
    document.querySelectorAll('#cat-chips .chip').forEach(c => c.classList.toggle('active', c.dataset.cat === selCat)); }
  if (p.has('type')) { selType = p.get('type');
    document.querySelectorAll('#type-chips .chip').forEach(c => c.classList.toggle('active', c.dataset.type === selType)); }
  if (p.has('view')) { viewMode = p.get('view');
    document.getElementById('btn-markers')?.classList.toggle('active', viewMode === 'markers');
    document.getElementById('btn-choropleth')?.classList.toggle('active', viewMode === 'choropleth'); }
}

// Patch render to also push state
const _origRender = render;
render = function() { _origRender(); pushState(); updateNavLinks(); };

restoreFromUrl();
loadAll();
</script>
</body>

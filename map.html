<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emlak AI — Xəritə</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9/dist/leaflet.js"></script>
  <style>
    body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    .map-controls {
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
      padding: 10px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
    }
    .map-stats { font-size: .78rem; color: #6b7280; white-space: nowrap; }

    .view-toggle {
      display: flex; gap: 4px; margin-left: auto;
    }
    .view-btn {
      padding: 5px 14px;
      border-radius: 7px;
      border: 1.5px solid #d1d5db;
      background: #fff;
      font-size: .78rem;
      cursor: pointer;
      font-weight: 500;
      color: #374151;
      transition: all .15s;
    }
    .view-btn.active { background: #6366f1; border-color: #6366f1; color: #fff; }

    #map { flex: 1; width: 100%; }

    /* Popup */
    .popup-photo { width: 200px; height: 130px; object-fit: cover; border-radius: 6px; margin-bottom: 8px; display: block; }
    .popup-price { font-size: 1rem; font-weight: 700; color: #1a1a2e; }
    .popup-ppm2  { font-size: .75rem; color: #6366f1; font-weight: 600; }
    .popup-loc   { font-size: .78rem; color: #4b5563; margin-top: 3px; }
    .popup-det   { font-size: .75rem; color: #6b7280; margin-top: 2px; }
    .popup-badge { display: inline-block; font-size: .65rem; font-weight: 600; padding: 1px 7px; border-radius: 999px; margin-top: 4px; }
    .popup-agency { background: #fef3c7; color: #b45309; }
    .popup-owner  { background: #dcfce7; color: #15803d; }
    .popup-link { display: block; margin-top: 8px; font-size: .78rem; color: #6366f1; text-decoration: none; }
    .popup-link:hover { text-decoration: underline; }

    /* Marker legend */
    .map-legend {
      position: absolute; bottom: 24px; right: 10px; z-index: 1000;
      background: #fff; border-radius: 8px; padding: 10px 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
      font-size: .75rem; color: #374151;
    }
    .legend-item { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
    .legend-item:last-child { margin-bottom: 0; }
    .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }

    /* Choropleth legend */
    .choropleth-legend {
      position: absolute; bottom: 24px; right: 10px; z-index: 1000;
      background: #fff; border-radius: 8px; padding: 10px 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
      font-size: .75rem; color: #374151;
      display: none;
    }
    .choropleth-legend.visible { display: block; }
    .choropleth-legend-title { font-weight: 700; margin-bottom: 6px; }
    .choro-item { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .choro-swatch { width: 20px; height: 12px; border-radius: 2px; flex-shrink: 0; border: 1px solid rgba(0,0,0,.1); }

    /* District tooltip */
    .district-tooltip {
      background: rgba(26,26,46,.88);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: .78rem;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
  </style>
</head>
<body>

<header>
  <h1>Emlak <span>AI</span></h1>
  <nav class="header-nav">
    <a href="index.html" class="nav-link">Elanlar</a>
    <a href="analytics.html" class="nav-link">Analitika</a>
    <a href="map.html" class="nav-link active">Xəritə</a>
  </nav>
</header>

<div class="map-controls">
  <div class="chips" id="cat-chips">
    <button class="chip active" data-cat="all">Hamısı</button>
    <button class="chip" data-cat="apartment">Mənzil</button>
    <button class="chip" data-cat="house">Həyət evi</button>
    <button class="chip" data-cat="land">Torpaq</button>
    <button class="chip" data-cat="commercial">Kommersiya</button>
    <button class="chip" data-cat="office">Ofis</button>
    <button class="chip" data-cat="garage">Qaraj</button>
  </div>
  <div class="chips" id="type-chips">
    <button class="chip active" data-type="all">Satış + Kirayə</button>
    <button class="chip" data-type="sale">Satış</button>
    <button class="chip" data-type="rental">Kirayə</button>
  </div>
  <span class="map-stats" id="map-stats">Yüklənir…</span>
  <div class="view-toggle">
    <button class="view-btn active" id="btn-markers">Markerlər</button>
    <button class="view-btn" id="btn-choropleth">Qiymət xəritəsi</button>
  </div>
</div>

<div id="map"></div>

<!-- Marker legend -->
<div class="map-legend" id="marker-legend">
  <div class="legend-item"><div class="legend-dot" style="background:#6366f1"></div> Mənzil</div>
  <div class="legend-item"><div class="legend-dot" style="background:#4ade80"></div> Həyət evi</div>
  <div class="legend-item"><div class="legend-dot" style="background:#f59e0b"></div> Torpaq</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ef4444"></div> Kommersiya</div>
  <div class="legend-item"><div class="legend-dot" style="background:#06b6d4"></div> Ofis</div>
  <div class="legend-item"><div class="legend-dot" style="background:#8b5cf6"></div> Qaraj</div>
</div>

<!-- Choropleth legend (hidden by default) -->
<div class="choropleth-legend" id="choropleth-legend">
  <div class="choropleth-legend-title">Orta ₼/m²</div>
  <div class="choro-item"><div class="choro-swatch" style="background:#dcfce7"></div><span id="choro-l1">—</span></div>
  <div class="choro-item"><div class="choro-swatch" style="background:#86efac"></div><span id="choro-l2">—</span></div>
  <div class="choro-item"><div class="choro-swatch" style="background:#fef08a"></div><span id="choro-l3">—</span></div>
  <div class="choro-item"><div class="choro-swatch" style="background:#fdba74"></div><span id="choro-l4">—</span></div>
  <div class="choro-item"><div class="choro-swatch" style="background:#f87171"></div><span id="choro-l5">—</span></div>
  <div class="choro-item"><div class="choro-swatch" style="background:#e5e7eb"></div><span>Məlumat yoxdur</span></div>
</div>

<script>
const CAT_COLORS = {
  apartment: '#6366f1', house: '#4ade80', land: '#f59e0b',
  commercial: '#ef4444', office: '#06b6d4', garage: '#8b5cf6',
};
const FILES = {
  apartment: ['sale','rental'], house: ['sale','rental'],
  land: ['sale'], commercial: ['sale','rental'],
  office: ['sale','rental'], garage: ['sale','rental'],
};
const CHORO_COLORS = ['#dcfce7','#86efac','#fef08a','#fdba74','#f87171'];

function fmt(n) { return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
function ppm2(l) {
  const a = typeof l.area_m2 === 'number' ? l.area_m2 : parseFloat(String(l.area_m2||'').match(/[\d.]+/)?.[0]);
  if (!l.price || !a || a <= 0) return null;
  return l.price / a;
}
function formatPrice(p, dt) { return dt === 'rental' ? `${fmt(p)} ₼/ay` : `${fmt(p)} ₼`; }

// Normalize district name for fuzzy matching
function normName(s) {
  return (s || '').toLowerCase()
    .replace(/rayonu?/g, '').replace(/\br\./g, '')
    .replace(/nəriman\s+nərimanov/g, 'nərimanov')
    .replace(/[^a-zəığüöçşı]/g, ' ')
    .trim().replace(/\s+/g, ' ');
}

// Init map
const map = L.map('map').setView([40.4093, 49.8671], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap', maxZoom: 19,
}).addTo(map);

const cache = {};
async function loadFile(cat, type) {
  const key = `${cat}_${type}`;
  if (cache[key]) return cache[key];
  try {
    const res = await fetch(`data/${key}.json`);
    cache[key] = res.ok ? await res.json() : [];
  } catch { cache[key] = []; }
  return cache[key];
}

let allListings = [];
let selCat = 'all', selType = 'all';
let viewMode = 'markers'; // 'markers' | 'choropleth'
let markerLayer = L.layerGroup().addTo(map);
let choroLayer = null;
let districtGeoJson = null;

// ── Load data ─────────────────────────────────────────────────────────────────
async function loadAll() {
  const pairs = [];
  Object.entries(FILES).forEach(([c, types]) => types.forEach(t => pairs.push([c, t])));
  const [listingsArr, geoJsonData] = await Promise.all([
    Promise.all(pairs.map(([c,t]) => loadFile(c,t))).then(r => r.flat()),
    fetch('districts.geojson').then(r => r.ok ? r.json() : null).catch(() => null),
  ]);
  allListings = listingsArr;
  districtGeoJson = geoJsonData;
  render();
}

// ── Choropleth helpers ────────────────────────────────────────────────────────
function computeDistrictPpm2(listings) {
  // Build map: normalised district name → [ppm2 values]
  const buckets = {};
  listings.forEach(l => {
    const v = ppm2(l);
    if (!v) return;
    const key = normName(l.location_name || l.location);
    if (!key) return;
    if (!buckets[key]) buckets[key] = [];
    buckets[key].push(v);
  });
  const avgs = {};
  Object.entries(buckets).forEach(([k, vals]) => {
    if (vals.length >= 2) avgs[k] = vals.reduce((a,b) => a+b, 0) / vals.length;
  });
  return avgs;
}

function quintileColor(value, sorted) {
  if (!value || !sorted.length) return '#e5e7eb';
  const pct = sorted.filter(v => v <= value).length / sorted.length;
  if (pct <= 0.2) return CHORO_COLORS[0];
  if (pct <= 0.4) return CHORO_COLORS[1];
  if (pct <= 0.6) return CHORO_COLORS[2];
  if (pct <= 0.8) return CHORO_COLORS[3];
  return CHORO_COLORS[4];
}

function matchDistrict(featureName, districtAvgs) {
  const fn = normName(featureName);
  // Exact match
  if (districtAvgs[fn] !== undefined) return districtAvgs[fn];
  // Partial match
  for (const [key, val] of Object.entries(districtAvgs)) {
    if (fn.includes(key) || key.includes(fn)) return val;
  }
  return null;
}

function buildChoroLayer(listings) {
  if (!districtGeoJson) return null;

  const active = listings.filter(l => !l.deleted_at);
  const districtAvgs = computeDistrictPpm2(active);
  const sortedVals = Object.values(districtAvgs).sort((a,b) => a-b);

  // Update legend labels
  const q = (p) => {
    const idx = Math.floor(p * sortedVals.length);
    return sortedVals[Math.min(idx, sortedVals.length - 1)];
  };
  if (sortedVals.length >= 5) {
    document.getElementById('choro-l1').textContent = `≤ ${fmt(q(0.2))} ₼/m²`;
    document.getElementById('choro-l2').textContent = `≤ ${fmt(q(0.4))} ₼/m²`;
    document.getElementById('choro-l3').textContent = `≤ ${fmt(q(0.6))} ₼/m²`;
    document.getElementById('choro-l4').textContent = `≤ ${fmt(q(0.8))} ₼/m²`;
    document.getElementById('choro-l5').textContent = `> ${fmt(q(0.8))} ₼/m²`;
  }

  return L.geoJSON(districtGeoJson, {
    style: (feature) => {
      const avg = matchDistrict(feature.properties.name, districtAvgs);
      return {
        fillColor: avg ? quintileColor(avg, sortedVals) : '#e5e7eb',
        fillOpacity: 0.65,
        color: '#94a3b8',
        weight: 1.5,
      };
    },
    onEachFeature: (feature, layer) => {
      const avg = matchDistrict(feature.properties.name, districtAvgs);
      const label = avg
        ? `<b>${feature.properties.name}</b><br>Orta ₼/m²: ${fmt(avg)} ₼`
        : `<b>${feature.properties.name}</b><br>Məlumat yoxdur`;

      layer.on({
        mouseover: (e) => {
          e.target.setStyle({ fillOpacity: 0.85, weight: 2.5, color: '#1a1a2e' });
          layer.bindTooltip(label, { className: 'district-tooltip', sticky: true }).openTooltip(e.latlng);
        },
        mouseout: (e) => {
          choroLayer.resetStyle(e.target);
          layer.closeTooltip();
        },
      });
    },
  });
}

// ── Render ────────────────────────────────────────────────────────────────────
function getFilteredListings() {
  return allListings.filter(l =>
    !l.deleted_at &&
    (selCat === 'all' || l.category === selCat) &&
    (selType === 'all' || l.deal_type === selType)
  );
}

function render() {
  const filtered = getFilteredListings();
  if (viewMode === 'markers') renderMarkers(filtered);
  else renderChoropleth(filtered);
}

function renderMarkers(list) {
  // Remove choropleth
  if (choroLayer) { map.removeLayer(choroLayer); choroLayer = null; }
  document.getElementById('choropleth-legend').classList.remove('visible');
  document.getElementById('marker-legend').style.display = '';

  markerLayer.clearLayers();
  const withCoords = list.filter(l => l.lat != null && l.lng != null);

  withCoords.forEach(l => {
    const color = CAT_COLORS[l.category] || '#6366f1';
    const marker = L.circleMarker([l.lat, l.lng], {
      radius: 7, fillColor: color, fillOpacity: 0.85, color: '#fff', weight: 1.5,
    });
    const m2 = ppm2(l);
    const area = typeof l.area_m2 === 'number' ? l.area_m2
      : parseFloat(String(l.area_m2||'').match(/[\d.]+/)?.[0]) || null;
    const det = [l.rooms, area ? `${area} m²` : '', l.land_area_sot ? `${l.land_area_sot} sot` : '']
      .filter(Boolean).join(' · ');
    const agencyBadge = l.is_agency === true
      ? '<span class="popup-badge popup-agency">Agentlik</span>'
      : l.is_agency === false ? '<span class="popup-badge popup-owner">Mülkiyyətçi</span>' : '';

    marker.bindPopup(`
      ${l.photo_url ? `<img class="popup-photo" src="${l.photo_url}" onerror="this.style.display='none'">` : ''}
      <div class="popup-price">${l.price ? formatPrice(l.price, l.deal_type) : '—'}</div>
      ${m2 ? `<div class="popup-ppm2">${fmt(m2)} ₼/m²</div>` : ''}
      ${l.location ? `<div class="popup-loc">${l.location}</div>` : ''}
      ${det ? `<div class="popup-det">${det}</div>` : ''}
      ${agencyBadge}
      <a class="popup-link" href="${l.url}" target="_blank" rel="noopener">bina.az-da aç →</a>
    `, { maxWidth: 220 });
    markerLayer.addLayer(marker);
  });

  document.getElementById('map-stats').textContent = `${withCoords.length.toLocaleString()} elan xəritədə`;
}

function renderChoropleth(list) {
  // Remove markers
  markerLayer.clearLayers();
  document.getElementById('marker-legend').style.display = 'none';
  document.getElementById('choropleth-legend').classList.add('visible');

  if (choroLayer) { map.removeLayer(choroLayer); choroLayer = null; }
  if (!districtGeoJson) {
    document.getElementById('map-stats').textContent = 'GeoJSON yüklənmədi';
    return;
  }

  choroLayer = buildChoroLayer(list);
  if (choroLayer) choroLayer.addTo(map);

  const withPpm2 = list.filter(l => ppm2(l) !== null);
  document.getElementById('map-stats').textContent = `${list.length.toLocaleString()} elan, ${districtGeoJson.features.length} rayon`;
}

// ── Events ────────────────────────────────────────────────────────────────────
document.getElementById('cat-chips').addEventListener('click', e => {
  const btn = e.target.closest('.chip'); if (!btn) return;
  document.querySelectorAll('#cat-chips .chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  selCat = btn.dataset.cat;
  render();
});
document.getElementById('type-chips').addEventListener('click', e => {
  const btn = e.target.closest('.chip'); if (!btn) return;
  document.querySelectorAll('#type-chips .chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  selType = btn.dataset.type;
  render();
});

document.getElementById('btn-markers').addEventListener('click', () => {
  viewMode = 'markers';
  document.getElementById('btn-markers').classList.add('active');
  document.getElementById('btn-choropleth').classList.remove('active');
  render();
});
document.getElementById('btn-choropleth').addEventListener('click', () => {
  viewMode = 'choropleth';
  document.getElementById('btn-choropleth').classList.add('active');
  document.getElementById('btn-markers').classList.remove('active');
  render();
});

loadAll();
</script>
</body>
</html>

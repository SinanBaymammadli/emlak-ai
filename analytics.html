<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emlak AI — Analitika</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <style>
    .page-content { padding: 20px 24px; }

    /* Stat tiles */
    .stat-tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
    @media (max-width: 900px) { .stat-tiles { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 500px) { .stat-tiles { grid-template-columns: 1fr; } }
    .stat-tile {
      background: #fff; border-radius: 10px;
      padding: 18px 20px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .stat-tile .label { font-size: .75rem; color: #6b7280; margin-bottom: 6px; }
    .stat-tile .value { font-size: 1.4rem; font-weight: 700; color: #1a1a2e; }

    /* Filter row */
    .filter-row { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 20px; }

    /* Charts grid */
    .charts-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    @media (max-width: 800px) { .charts-grid { grid-template-columns: 1fr; } }

    .chart-card {
      background: #fff; border-radius: 10px;
      padding: 18px 20px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .chart-card h3 { font-size: .88rem; font-weight: 600; color: #374151; margin-bottom: 14px; }
    .chart-card.full-width { grid-column: 1 / -1; }
    .chart-wrap { position: relative; }
    .no-data { text-align: center; padding: 40px 0; color: #9ca3af; font-size: .85rem; }

    /* Spinner */
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #e5e7eb; border-top-color: #6366f1;
      border-radius: 50%; animation: spin .7s linear infinite;
      margin: 60px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <h1>Emlak <span>AI</span></h1>
  <nav class="header-nav">
    <a href="index.html" class="nav-link">Elanlar</a>
    <a href="analytics.html" class="nav-link active">Analitika</a>
    <a href="map.html" class="nav-link">Xəritə</a>
  </nav>
</header>

<div class="page-content" id="page-content">
  <div class="spinner"></div>
</div>

<script>
const FILES = {
  apartment: ['sale','rental'], house: ['sale','rental'],
  land: ['sale'], commercial: ['sale','rental'],
  office: ['sale','rental'], garage: ['sale','rental'],
};
const PALETTE = ['#6366f1','#4ade80','#f59e0b','#ef4444','#06b6d4','#8b5cf6','#ec4899'];

function fmt(n) { return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
function ppm2(l) {
  const a = typeof l.area_m2 === 'number' ? l.area_m2 : parseFloat(String(l.area_m2||'').match(/[\d.]+/)?.[0]);
  if (!l.price || !a || a <= 0) return null;
  return l.price / a;
}
function locLabel(l) { return l.location_name || l.location || ''; }
function catLabel(c) {
  return {apartment:'Mənzil',house:'Həyət evi',land:'Torpaq',commercial:'Kommersiya',office:'Ofis',garage:'Qaraj'}[c]||c;
}

const cache = {};
async function loadFile(cat, type) {
  const key = `${cat}_${type}`;
  if (cache[key]) return cache[key];
  try {
    const res = await fetch(`data/${key}.json`);
    cache[key] = res.ok ? await res.json() : [];
  } catch { cache[key] = []; }
  return cache[key];
}

let allListings = [];
let selCat   = 'all';
let selType  = 'all';
let selLocs  = new Set();
let showDel  = false;
let priceMin = null, priceMax = null;
let areaMin  = null, areaMax  = null;
let sotMin   = null, sotMax   = null;
let ppm2Min  = null, ppm2Max  = null;
let roomsF   = '';
let repairF  = '';
let agencyF  = '';
const charts = {};

async function loadAll() {
  const pairs = [];
  Object.entries(FILES).forEach(([c, types]) => types.forEach(t => pairs.push([c,t])));
  allListings = (await Promise.all(pairs.map(([c,t]) => loadFile(c,t)))).flat();
  render();
  buildAnalyticsLocDropdown();
}

function numVal(id) { const v = parseFloat(document.getElementById(id)?.value); return isNaN(v) ? null : v; }

function filtered() {
  priceMin = numVal('f-pmin'); priceMax = numVal('f-pmax');
  areaMin  = numVal('f-amin'); areaMax  = numVal('f-amax');
  sotMin   = numVal('f-smin'); sotMax   = numVal('f-smax');
  ppm2Min  = numVal('f-mmin'); ppm2Max  = numVal('f-mmax');
  roomsF   = document.getElementById('f-rooms')?.value  || '';
  repairF  = document.getElementById('f-repair')?.value || '';
  agencyF  = document.getElementById('f-agency')?.value || '';
  showDel  = document.getElementById('f-del')?.checked  || false;

  let list = showDel ? allListings : allListings.filter(l => !l.deleted_at);
  if (selCat  !== 'all') list = list.filter(l => l.category  === selCat);
  if (selType !== 'all') list = list.filter(l => l.deal_type === selType);
  if (selLocs.size)      list = list.filter(l => selLocs.has(l.location_name || l.location || ''));
  if (priceMin != null)  list = list.filter(l => l.price != null && l.price >= priceMin);
  if (priceMax != null)  list = list.filter(l => l.price != null && l.price <= priceMax);
  if (areaMin  != null)  list = list.filter(l => { const a = typeof l.area_m2==='number'?l.area_m2:parseFloat(String(l.area_m2||'').match(/[\d.]+/)?.[0]); return a != null && a >= areaMin; });
  if (areaMax  != null)  list = list.filter(l => { const a = typeof l.area_m2==='number'?l.area_m2:parseFloat(String(l.area_m2||'').match(/[\d.]+/)?.[0]); return a != null && a <= areaMax; });
  if (sotMin   != null)  list = list.filter(l => l.land_area_sot != null && l.land_area_sot >= sotMin);
  if (sotMax   != null)  list = list.filter(l => l.land_area_sot != null && l.land_area_sot <= sotMax);
  if (ppm2Min  != null)  list = list.filter(l => { const v = ppm2(l); return v != null && v >= ppm2Min; });
  if (ppm2Max  != null)  list = list.filter(l => { const v = ppm2(l); return v != null && v <= ppm2Max; });
  if (roomsF) {
    if (roomsF === '5') list = list.filter(l => { const m = String(l.rooms||'').match(/\d+/); return m && parseInt(m[0]) >= 5; });
    else { const n = parseInt(roomsF); list = list.filter(l => { const m = String(l.rooms||'').match(/\d+/); return m && parseInt(m[0]) === n; }); }
  }
  if (repairF === 'yes') list = list.filter(l => l.has_repair === true);
  if (repairF === 'no')  list = list.filter(l => l.has_repair === false);
  if (agencyF === 'agency') list = list.filter(l => l.is_agency === true);
  if (agencyF === 'owner')  list = list.filter(l => l.is_agency === false);
  return list;
}

function render() {
  const list = filtered();
  document.getElementById('page-content').innerHTML = buildHTML();
  wireFilters();
  renderStats(list);
  renderCharts(list);
}

function buildHTML() {
  return `
    <div class="filter-row" id="cat-filter">
      ${['all','apartment','house','land','commercial','office','garage'].map(c => `
        <button class="chip ${selCat===c?'active':''}" data-cat="${c}">${c==='all'?'Hamısı':catLabel(c)}</button>
      `).join('')}
    </div>
    <div class="filter-row" id="type-filter">
      <button class="chip ${selType==='all'?'active':''}"    data-type="all">Satış + Kirayə</button>
      <button class="chip ${selType==='sale'?'active':''}"   data-type="sale">Satış</button>
      <button class="chip ${selType==='rental'?'active':''}" data-type="rental">Kirayə</button>
    </div>
    <div class="filters" style="margin-bottom:10px">
      <div class="ms-wrap" id="a-ms-wrap">
        <button class="ms-btn" id="a-ms-btn">
          <span id="a-ms-label">Bütün məkanlar</span>
          <span class="ms-caret">▼</span>
        </button>
        <div class="ms-dropdown" id="a-ms-dropdown">
          <input class="ms-search" id="a-ms-search" placeholder="Axtar…" autocomplete="off">
          <div class="ms-actions">
            <button id="a-ms-all">Hamısını seç</button>
            <button id="a-ms-none">Sıfırla</button>
          </div>
          <div class="ms-list" id="a-ms-list"></div>
        </div>
      </div>
      <label><input type="checkbox" id="f-del"> Silinmişləri göstər</label>
    </div>
    <div class="filters" style="margin-bottom:14px">
      <div class="filter-group"><span class="filter-label">Qiymət:</span><input type="number" id="f-pmin" placeholder="Min ₼" min="0" style="width:90px"><span class="sep">–</span><input type="number" id="f-pmax" placeholder="Max ₼" min="0" style="width:90px"></div>
      <div class="filter-group"><span class="filter-label">Sahə (m²):</span><input type="number" id="f-amin" placeholder="Min" min="0" style="width:70px"><span class="sep">–</span><input type="number" id="f-amax" placeholder="Max" min="0" style="width:70px"></div>
      <div class="filter-group"><span class="filter-label">₼/m²:</span><input type="number" id="f-mmin" placeholder="Min" min="0" style="width:70px"><span class="sep">–</span><input type="number" id="f-mmax" placeholder="Max" min="0" style="width:70px"></div>
      <div class="filter-group"><span class="filter-label">Torpaq (sot):</span><input type="number" id="f-smin" placeholder="Min" min="0" style="width:60px"><span class="sep">–</span><input type="number" id="f-smax" placeholder="Max" min="0" style="width:60px"></div>
      <div class="filter-group"><span class="filter-label">Otaq:</span><select id="f-rooms"><option value="">Hamısı</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5+</option></select></div>
      <div class="filter-group"><span class="filter-label">Təmir:</span><select id="f-repair"><option value="">Hamısı</option><option value="yes">Var</option><option value="no">Yox</option></select></div>
      <div class="filter-group"><span class="filter-label">Elan sahibi:</span><select id="f-agency"><option value="">Hamısı</option><option value="owner">Mülkiyyətçi</option><option value="agency">Agentlik</option></select></div>
    </div>
    <div class="stat-tiles" id="stat-tiles">
      <div class="stat-tile"><div class="label">Aktiv elanlar</div><div class="value" id="s-total">—</div></div>
      <div class="stat-tile"><div class="label">${selType==='rental'?'Orta kirayə (₼/ay)':'Orta qiymət'}</div><div class="value" id="s-avg-price">—</div></div>
      <div class="stat-tile"><div class="label">Orta ₼/m²</div><div class="value" id="s-avg-ppm2">—</div></div>
      <div class="stat-tile"><div class="label">Unikal məkanlar</div><div class="value" id="s-locs">—</div></div>
    </div>
    <div class="charts-grid">
      <div class="chart-card"><h3>Məkana görə elan sayı (top 15)</h3><div class="chart-wrap" style="height:300px"><canvas id="c-loc-count"></canvas></div></div>
      <div class="chart-card"><h3>Məkana görə orta ₼/m² (top 15)</h3><div class="chart-wrap" style="height:300px"><canvas id="c-loc-ppm2"></canvas></div></div>
      <div class="chart-card"><h3>Kateqoriyaya görə</h3><div class="chart-wrap" style="height:240px"><canvas id="c-cat"></canvas></div></div>
      <div class="chart-card"><h3>Satış vs Kirayə</h3><div class="chart-wrap" style="height:240px"><canvas id="c-deal"></canvas></div></div>
      <div class="chart-card"><h3>Yeni vs Köhnə tikili</h3><div class="chart-wrap" style="height:240px"><canvas id="c-build"></canvas></div></div>
      <div class="chart-card"><h3>Agentlik vs Mülkiyyətçi</h3><div class="chart-wrap" style="height:240px"><canvas id="c-agency"></canvas></div></div>
      <div class="chart-card full-width"><h3>Qiymət paylanması${selType==='rental'?' (kirayə)':' (satış)'}</h3><div class="chart-wrap" style="height:240px"><canvas id="c-price-dist"></canvas></div></div>
    </div>`;
}

function wireFilters() {
  document.getElementById('cat-filter').addEventListener('click', e => {
    const btn = e.target.closest('.chip'); if (!btn) return;
    selCat = btn.dataset.cat; render();
  });
  document.getElementById('type-filter').addEventListener('click', e => {
    const btn = e.target.closest('.chip'); if (!btn) return;
    selType = btn.dataset.type; render();
  });
  ['f-pmin','f-pmax','f-amin','f-amax','f-smin','f-smax','f-mmin','f-mmax'].forEach(id => {
    document.getElementById(id)?.addEventListener('input', render);
  });
  ['f-rooms','f-repair','f-agency'].forEach(id => {
    document.getElementById(id)?.addEventListener('change', render);
  });
  document.getElementById('f-del')?.addEventListener('change', render);

  // Location multiselect
  buildAnalyticsLocDropdown();
  document.getElementById('a-ms-btn').addEventListener('click', e => {
    e.stopPropagation();
    document.getElementById('a-ms-dropdown').classList.toggle('open');
    if (document.getElementById('a-ms-dropdown').classList.contains('open'))
      document.getElementById('a-ms-search').focus();
  });
  document.addEventListener('click', e => {
    if (!document.getElementById('a-ms-wrap')?.contains(e.target))
      document.getElementById('a-ms-dropdown')?.classList.remove('open');
  });
  document.getElementById('a-ms-search').addEventListener('input', e => buildAnalyticsLocDropdown(e.target.value));
  document.getElementById('a-ms-all').addEventListener('click', () => {
    allListings.map(l => l.location_name || l.location || '').filter(Boolean).forEach(l => selLocs.add(l));
    buildAnalyticsLocDropdown(); updateAnalyticsMsLabel(); render();
  });
  document.getElementById('a-ms-none').addEventListener('click', () => {
    selLocs.clear(); buildAnalyticsLocDropdown(); updateAnalyticsMsLabel(); render();
  });
}

const ALL_LOCATIONS = ['20 Yanvar m.','20-ci sahə q.','28 May m.','9-cu mikrorayon q.','Azadlıq Prospekti m.','Ağ şəhər q.','Badamdar q.','Bakıxanov q.','Bayıl q.','Bilgəh q.','Biləcəri q.','Binə q.','Binəqədi q.','Binəqədi r.','Buzovna q.','Dübəndi q.','Elmlər Akademiyası m.','Görədil q.','Gənclik m.','Hökməli q.','Hövsan q.','Həzi Aslanov m.','Həzi Aslanov q.','Koroğlu m.','Lökbatan q.','M.Ə.Rəsulzadə q.','Masazır q.','Mehdiabad q.','Memar Əcəmi m.','Məmmədli q.','Mərdəkan q.','Nardaran q.','Neftçilər m.','Nizami m.','Nizami r.','Novxanı q.','Nəriman Nərimanov m.','Nərimanov r.','Nəsimi r.','Qala q.','Qara Qarayev m.','Qaraçuxur q.','Qobu q.','Sahil q.','Saray q.','Sea Breeze q.','Türkan q.','Yasamal q.','Yasamal r.','Yeni Ramana q.','Yeni Yasamal q.','Zabrat q.','Zığ q.','İnşaatçılar m.','İçəri Şəhər m.','Şah İsmayıl Xətai m.','Şağan q.','Şüvəlan q.','Əhmədli m.','Ələt q.','Əmircan q.'];

function buildAnalyticsLocDropdown(searchVal = '') {
  const listEl = document.getElementById('a-ms-list'); if (!listEl) return;
  const fromData = allListings.map(l => l.location_name || l.location || '').filter(Boolean);
  const locs = [...new Set([...ALL_LOCATIONS, ...fromData])].sort();
  const q = searchVal.toLowerCase();
  const visible = q ? locs.filter(l => l.toLowerCase().includes(q)) : locs;
  if (!visible.length) { listEl.innerHTML = '<div class="ms-empty">Nəticə yoxdur</div>'; return; }
  listEl.innerHTML = visible.map(loc => `<label class="ms-item"><input type="checkbox" value="${loc.replace(/"/g,'&quot;')}" ${selLocs.has(loc)?'checked':''}><span>${loc}</span></label>`).join('');
  listEl.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', () => { if (cb.checked) selLocs.add(cb.value); else selLocs.delete(cb.value); updateAnalyticsMsLabel(); render(); });
  });
}

function updateAnalyticsMsLabel() {
  const btn = document.getElementById('a-ms-btn');
  const label = document.getElementById('a-ms-label');
  if (!btn || !label) return;
  if (selLocs.size === 0) { label.textContent = 'Bütün məkanlar'; btn.classList.remove('has-selection'); }
  else { label.textContent = `${selLocs.size} məkan seçildi`; btn.classList.add('has-selection'); }
}

function renderStats(list) {
  document.getElementById('s-total').textContent = list.length.toLocaleString();

  const prices = list.filter(l => l.price).map(l => l.price);
  document.getElementById('s-avg-price').textContent = prices.length
    ? `${fmt(prices.reduce((a,b)=>a+b,0)/prices.length)} ₼` : '—';

  const pm2vals = list.map(ppm2).filter(Boolean);
  document.getElementById('s-avg-ppm2').textContent = pm2vals.length
    ? `${fmt(pm2vals.reduce((a,b)=>a+b,0)/pm2vals.length)} ₼/m²` : '—';

  const locs = new Set(list.map(locLabel).filter(Boolean));
  document.getElementById('s-locs').textContent = locs.size;
}

function makeBar(id, labels, data, color = PALETTE[0], horizontal = true) {
  const ctx = document.getElementById(id);
  if (!ctx) return;
  if (charts[id]) { charts[id].destroy(); }
  if (!data.length) { ctx.parentElement.innerHTML = '<div class="no-data">Məlumat yoxdur</div>'; return; }
  charts[id] = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: [{ data, backgroundColor: color, borderRadius: 4 }] },
    options: {
      indexAxis: horizontal ? 'y' : 'x',
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { color: '#f0f2f5' }, ticks: { font: { size: 11 } } },
        y: { grid: { display: false }, ticks: { font: { size: 11 } } },
      },
    },
  });
}

function makeDoughnut(id, labels, data) {
  const ctx = document.getElementById(id);
  if (!ctx) return;
  if (charts[id]) { charts[id].destroy(); }
  if (!data.some(d => d > 0)) { ctx.parentElement.innerHTML = '<div class="no-data">Məlumat yoxdur</div>'; return; }
  charts[id] = new Chart(ctx, {
    type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: PALETTE, borderWidth: 2, borderColor: '#fff' }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { font: { size: 11 }, boxWidth: 12 } } },
    },
  });
}

function renderCharts(list) {
  // 1. Count by location
  const locCount = {};
  list.forEach(l => { const k = locLabel(l); if (k) locCount[k] = (locCount[k]||0) + 1; });
  const topLocs = Object.entries(locCount).sort((a,b)=>b[1]-a[1]).slice(0,15);
  makeBar('c-loc-count', topLocs.map(x=>x[0]), topLocs.map(x=>x[1]), PALETTE[0]);

  // 2. Avg ppm2 by location
  const locPpm2 = {};
  list.forEach(l => {
    const k = locLabel(l); const v = ppm2(l);
    if (k && v) { if (!locPpm2[k]) locPpm2[k] = []; locPpm2[k].push(v); }
  });
  const topPpm2 = Object.entries(locPpm2)
    .filter(([,v]) => v.length >= 3)
    .map(([k,v]) => [k, v.reduce((a,b)=>a+b,0)/v.length])
    .sort((a,b)=>b[1]-a[1]).slice(0,15);
  makeBar('c-loc-ppm2', topPpm2.map(x=>x[0]), topPpm2.map(x=>Math.round(x[1])), PALETTE[2]);

  // 3. By category
  const cats = ['apartment','house','land','commercial','office','garage'];
  const catCounts = cats.map(c => list.filter(l => l.category === c).length);
  makeDoughnut('c-cat', cats.map(catLabel), catCounts);

  // 4. Sale vs Rental
  makeDoughnut('c-deal', ['Satış','Kirayə'], [
    list.filter(l=>l.deal_type==='sale').length,
    list.filter(l=>l.deal_type==='rental').length,
  ]);

  // 5. New vs Old building (apartments + houses only)
  const resid = list.filter(l => l.category==='apartment'||l.category==='house');
  makeDoughnut('c-build', ['Yeni tikili','Köhnə tikili','Məlum deyil'], [
    resid.filter(l=>l.building_type==='Yeni tikili').length,
    resid.filter(l=>l.building_type==='Köhnə tikili').length,
    resid.filter(l=>!l.building_type).length,
  ]);

  // 6. Agency vs Owner
  makeDoughnut('c-agency', ['Agentlik','Mülkiyyətçi','Məlum deyil'], [
    list.filter(l=>l.is_agency===true).length,
    list.filter(l=>l.is_agency===false).length,
    list.filter(l=>l.is_agency==null).length,
  ]);

  // 7. Price distribution (sale only)
  const sale = list.filter(l => l.deal_type==='sale' && l.price);
  const buckets = [[0,50000,'0–50k'],[50000,100000,'50–100k'],[100000,150000,'100–150k'],
    [150000,200000,'150–200k'],[200000,300000,'200–300k'],[300000,Infinity,'300k+']];
  const bCounts = buckets.map(([lo,hi]) => sale.filter(l=>l.price>=lo&&l.price<hi).length);
  makeBar('c-price-dist', buckets.map(b=>b[2]), bCounts, PALETTE[0], false);
}

// ── URL search param sync ─────────────────────────────────────────────────────

function updateNavLinks() {
  const shared = new URLSearchParams();
  if (selCat  !== 'all') shared.set('cat',  selCat);
  if (selType !== 'all') shared.set('type', selType);
  if (selLocs.size)      shared.set('locs', [...selLocs].join('|'));
  const str = shared.toString();
  document.querySelectorAll('.nav-link').forEach(a => {
    const base = a.getAttribute('href').split('?')[0];
    a.href = str ? `${base}?${str}` : base;
  });
}

function pushState() {
  const p = new URLSearchParams();
  if (selCat  !== 'all')  p.set('cat',    selCat);
  if (selType !== 'all')  p.set('type',   selType);
  if (showDel)            p.set('del',    '1');
  if (priceMin != null)   p.set('pmin',   priceMin);
  if (priceMax != null)   p.set('pmax',   priceMax);
  if (areaMin  != null)   p.set('amin',   areaMin);
  if (areaMax  != null)   p.set('amax',   areaMax);
  if (sotMin   != null)   p.set('smin',   sotMin);
  if (sotMax   != null)   p.set('smax',   sotMax);
  if (ppm2Min  != null)   p.set('mmin',   ppm2Min);
  if (ppm2Max  != null)   p.set('mmax',   ppm2Max);
  if (roomsF)             p.set('rooms',  roomsF);
  if (repairF)            p.set('repair', repairF);
  if (agencyF)            p.set('agency', agencyF);
  if (selLocs.size)       p.set('locs',   [...selLocs].join('|'));
  const str = p.toString();
  history.replaceState(null, '', str ? `?${str}` : location.pathname);
}

function restoreFromUrl() {
  const p = new URLSearchParams(location.search);
  if (p.has('cat'))    selCat  = p.get('cat');
  if (p.has('type'))   selType = p.get('type');
  if (p.has('del'))    showDel = p.get('del') === '1';
  if (p.has('locs'))   p.get('locs').split('|').filter(Boolean).forEach(l => selLocs.add(l));
  // Range inputs restored after render() creates them — handled in render() below
  window._urlParams = p;
}

const _origRender = render;
render = function() {
  _origRender();
  updateNavLinks();
  // Restore input values from URL after DOM is rebuilt
  const p = window._urlParams;
  if (!p) { pushState(); return; }
  const map = {pmin:'f-pmin',pmax:'f-pmax',amin:'f-amin',amax:'f-amax',
               smin:'f-smin',smax:'f-smax',mmin:'f-mmin',mmax:'f-mmax',
               rooms:'f-rooms',repair:'f-repair',agency:'f-agency'};
  Object.entries(map).forEach(([key, id]) => { if (p.has(key)) { const el = document.getElementById(id); if (el) el.value = p.get(key); } });
  if (p.has('del')) { const el = document.getElementById('f-del'); if (el) el.checked = showDel; }
  updateAnalyticsMsLabel();
  pushState();
};

restoreFromUrl();
loadAll();
</script>
</body>
</html>

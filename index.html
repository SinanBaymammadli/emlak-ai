<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emlak AI — Bakı Əmlak Bazarı</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: #1a1a2e;
      color: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,.4);
    }
    header h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: .5px; }
    header h1 span { color: #4ade80; }
    #global-stats { font-size: .78rem; color: #94a3b8; margin-left: auto; white-space: nowrap; }

    /* ── Controls ── */
    .controls {
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
      padding: 12px 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .chip {
      padding: 4px 12px;
      border-radius: 999px;
      border: 1.5px solid #d1d5db;
      background: #fff;
      font-size: .78rem;
      cursor: pointer;
      transition: all .15s;
      color: #374151;
      font-weight: 500;
    }
    .chip:hover { border-color: #6366f1; color: #6366f1; }
    .chip.active { background: #6366f1; border-color: #6366f1; color: #fff; }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .filter-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .filter-label {
      font-size: .72rem;
      color: #6b7280;
      white-space: nowrap;
    }
    .filters input[type=text],
    .filters input[type=number],
    .filters select {
      padding: 5px 8px;
      border: 1.5px solid #d1d5db;
      border-radius: 7px;
      font-size: .78rem;
      background: #fff;
      outline: none;
      color: #1a1a2e;
    }
    .filters input[type=text] { min-width: 160px; flex: 1; }
    .filters input[type=number] { width: 80px; }
    .filters input:focus, .filters select:focus { border-color: #6366f1; }
    .filters select { cursor: pointer; }
    .filters label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: .78rem;
      color: #6b7280;
      cursor: pointer;
      white-space: nowrap;
    }
    .sep { color: #d1d5db; font-size: .8rem; }

    /* ── Location multiselect ── */
    .ms-wrap { position: relative; }
    .ms-btn {
      padding: 5px 10px;
      border: 1.5px solid #d1d5db; border-radius: 7px;
      background: #fff; cursor: pointer;
      font-size: .78rem; color: #1a1a2e;
      display: flex; align-items: center; gap: 6px;
      white-space: nowrap; min-width: 160px;
    }
    .ms-btn:hover { border-color: #6366f1; }
    .ms-btn.has-selection { border-color: #6366f1; color: #6366f1; font-weight: 600; }
    .ms-btn .ms-caret { margin-left: auto; color: #9ca3af; font-size: .65rem; }
    .ms-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      z-index: 200;
      background: #fff;
      border: 1.5px solid #d1d5db;
      border-radius: 9px;
      box-shadow: 0 8px 24px rgba(0,0,0,.12);
      width: 260px;
      max-height: 320px;
      overflow: hidden;
      display: none;
      flex-direction: column;
    }
    .ms-dropdown.open { display: flex; }
    .ms-search {
      padding: 8px 10px;
      border: none;
      border-bottom: 1px solid #f0f2f5;
      font-size: .78rem;
      outline: none;
      width: 100%;
    }
    .ms-actions {
      display: flex; gap: 8px;
      padding: 5px 10px;
      border-bottom: 1px solid #f0f2f5;
    }
    .ms-actions button {
      font-size: .7rem; color: #6366f1;
      background: none; border: none;
      cursor: pointer; padding: 0;
      font-weight: 600;
    }
    .ms-actions button:hover { text-decoration: underline; }
    .ms-list {
      overflow-y: auto;
      max-height: 240px;
      padding: 4px 0;
    }
    .ms-item {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 12px;
      font-size: .78rem; cursor: pointer;
      color: #374151;
    }
    .ms-item:hover { background: #f5f3ff; }
    .ms-item input[type=checkbox] { accent-color: #6366f1; cursor: pointer; flex-shrink: 0; }
    .ms-empty { padding: 12px; font-size: .78rem; color: #9ca3af; text-align: center; }

    /* ── Stats bar ── */
    .stats-bar {
      padding: 7px 24px;
      font-size: .77rem;
      color: #6b7280;
      background: #f0f2f5;
    }

    /* ── Grid — 5 columns ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      padding: 0 24px 24px;
    }
    @media (max-width: 1400px) { .grid { grid-template-columns: repeat(4, 1fr); } }
    @media (max-width: 1000px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 680px)  { .grid { grid-template-columns: repeat(2, 1fr); padding: 0 12px 16px; } }
    @media (max-width: 420px)  { .grid { grid-template-columns: 1fr; } }

    /* ── Card ── */
    .card {
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      transition: transform .15s, box-shadow .15s;
      display: flex;
      flex-direction: column;
    }
    .card:hover { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(0,0,0,.12); }
    .card.deleted { opacity: .5; }

    .card-photo-wrap {
      position: relative;
      aspect-ratio: 4/3;
      overflow: hidden;
      background: #e5e7eb;
      display: block;
    }
    .card-photo-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform .2s;
    }
    .card:hover .card-photo-wrap img { transform: scale(1.04); }
    .card-photo-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: #e5e7eb; color: #9ca3af; font-size: 1.8rem;
    }

    .card-body { padding: 9px 10px; flex: 1; display: flex; flex-direction: column; gap: 4px; }

    .card-price-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .card-price { font-size: .95rem; font-weight: 700; color: #1a1a2e; }
    .price-drop { font-size: .68rem; font-weight: 600; color: #16a34a; background: #dcfce7; padding: 1px 6px; border-radius: 999px; }
    .price-rise { font-size: .68rem; font-weight: 600; color: #dc2626; background: #fee2e2; padding: 1px 6px; border-radius: 999px; }

    .card-unit-price { font-size: .72rem; color: #6366f1; font-weight: 600; }

    .card-location { font-size: .75rem; color: #4b5563; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-details { font-size: .73rem; color: #6b7280; }

    .card-badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 1px; }
    .badge {
      font-size: .64rem; font-weight: 600;
      padding: 1px 7px; border-radius: 999px;
    }
    .badge-repair  { background: #ede9fe; color: #7c3aed; }
    .badge-deleted { background: #f3f4f6; color: #9ca3af; }
    .badge-cat     { background: #e0f2fe; color: #0369a1; }

    .card-footer { display: flex; gap: 8px; padding: 0 10px 8px; margin-top: auto; }
    .card-footer a {
      font-size: .78rem; color: #6b7280; font-weight: 500;
      text-decoration: none; display: flex; align-items: center; gap: 3px;
      padding: 3px 6px; border-radius: 5px; transition: background .12s, color .12s;
    }
    .card-footer a:hover { color: #6366f1; background: #f5f3ff; }

    /* ── Pagination ── */
    .pagination {
      display: flex; align-items: center; justify-content: center;
      gap: 12px; padding: 16px 24px 32px;
    }
    .pagination button {
      padding: 7px 18px;
      border: 1.5px solid #d1d5db; border-radius: 8px;
      background: #fff; cursor: pointer;
      font-size: .82rem; font-weight: 500; transition: all .15s;
    }
    .pagination button:hover:not(:disabled) { border-color: #6366f1; color: #6366f1; }
    .pagination button:disabled { opacity: .4; cursor: default; }
    .pagination span { font-size: .82rem; color: #6b7280; }

    /* ── States ── */
    .state-msg {
      grid-column: 1 / -1; text-align: center;
      padding: 60px 20px; color: #9ca3af; font-size: .9rem;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #e5e7eb; border-top-color: #6366f1;
      border-radius: 50%; animation: spin .7s linear infinite;
      margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <h1>Emlak <span>AI</span></h1>
  <div id="global-stats">Yüklənir…</div>
</header>

<div class="controls">

  <!-- Category chips -->
  <div class="chips" id="cat-chips">
    <button class="chip active" data-cat="all">Hamısı</button>
    <button class="chip" data-cat="apartment">Mənzil</button>
    <button class="chip" data-cat="house">Həyət evi</button>
    <button class="chip" data-cat="land">Torpaq</button>
    <button class="chip" data-cat="commercial">Kommersiya</button>
    <button class="chip" data-cat="office">Ofis</button>
    <button class="chip" data-cat="garage">Qaraj</button>
  </div>

  <!-- Deal type chips -->
  <div class="chips" id="type-chips">
    <button class="chip active" data-type="all">Satış + Kirayə</button>
    <button class="chip" data-type="sale">Satış</button>
    <button class="chip" data-type="rental">Kirayə</button>
  </div>

  <!-- Row 1: location multiselect + sort -->
  <div class="filters">
    <div class="ms-wrap" id="ms-wrap">
      <button class="ms-btn" id="ms-btn">
        <span id="ms-label">Bütün məkanlar</span>
        <span class="ms-caret">▼</span>
      </button>
      <div class="ms-dropdown" id="ms-dropdown">
        <input class="ms-search" id="ms-search" placeholder="Axtar…" autocomplete="off">
        <div class="ms-actions">
          <button id="ms-all">Hamısını seç</button>
          <button id="ms-none">Sıfırla</button>
        </div>
        <div class="ms-list" id="ms-list"></div>
      </div>
    </div>
    <select id="sort">
      <option value="newest">Ən yeni</option>
      <option value="price_asc">Qiymət ↑</option>
      <option value="price_desc">Qiymət ↓</option>
      <option value="ppm2_asc">₼/m² ↑</option>
      <option value="ppm2_desc">₼/m² ↓</option>
      <option value="ppsot_asc">₼/sot ↑</option>
      <option value="ppsot_desc">₼/sot ↓</option>
      <option value="area_asc">Sahə ↑</option>
      <option value="area_desc">Sahə ↓</option>
    </select>
    <label><input type="checkbox" id="show-deleted"> Silinmişləri göstər</label>
  </div>

  <!-- Row 2: range filters -->
  <div class="filters">
    <div class="filter-group">
      <span class="filter-label">Qiymət:</span>
      <input type="number" id="price-min" placeholder="Min ₼" min="0">
      <span class="sep">–</span>
      <input type="number" id="price-max" placeholder="Max ₼" min="0">
    </div>
    <div class="filter-group">
      <span class="filter-label">Sahə (m²):</span>
      <input type="number" id="area-min" placeholder="Min" min="0">
      <span class="sep">–</span>
      <input type="number" id="area-max" placeholder="Max" min="0">
    </div>
    <div class="filter-group">
      <span class="filter-label">Torpaq (sot):</span>
      <input type="number" id="sot-min" placeholder="Min" min="0">
      <span class="sep">–</span>
      <input type="number" id="sot-max" placeholder="Max" min="0">
    </div>
    <div class="filter-group">
      <span class="filter-label">₼/m²:</span>
      <input type="number" id="ppm2-min" placeholder="Min" min="0">
      <span class="sep">–</span>
      <input type="number" id="ppm2-max" placeholder="Max" min="0">
    </div>
    <div class="filter-group">
      <span class="filter-label">Otaq:</span>
      <select id="rooms-filter">
        <option value="">Hamısı</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5+</option>
      </select>
    </div>
    <div class="filter-group">
      <span class="filter-label">Təmir:</span>
      <select id="repair-filter">
        <option value="">Hamısı</option>
        <option value="yes">Var</option>
        <option value="no">Yox</option>
      </select>
    </div>
  </div>

</div>

<div class="stats-bar" id="stats-bar">Yüklənir…</div>
<div class="grid" id="grid"></div>
<div class="pagination" id="pagination" style="display:none"></div>

<script>
const FILES = {
  apartment: ['sale','rental'],
  house:     ['sale','rental'],
  land:      ['sale'],
  commercial:['sale','rental'],
  office:    ['sale','rental'],
  garage:    ['sale','rental'],
};
const CATS = Object.keys(FILES);
const PAGE_SIZE = 50;

// State
let selCat      = 'all';
let selType     = 'all';
let selLocs     = new Set(); // empty = all locations
let sort        = 'newest';
let showDel  = false;
let page     = 1;
let priceMin = null, priceMax = null;
let areaMin  = null, areaMax  = null;
let sotMin   = null, sotMax   = null;
let ppm2Min  = null, ppm2Max  = null;
let roomsF   = '';
let repairF  = '';

const cache = {};
let allListings = [];
let filtered    = [];
let loading     = false;

// ── Helpers ──────────────────────────────────────────────────────────────────

function fmt(n) {
  if (n == null) return '—';
  return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}

function formatPrice(price, dealType) {
  if (!price && price !== 0) return '—';
  return dealType === 'rental' ? `${fmt(price)} ₼/ay` : `${fmt(price)} ₼`;
}

function areaVal(l) {
  if (l.area_m2 == null) return null;
  if (typeof l.area_m2 === 'number') return l.area_m2;
  const m = String(l.area_m2).match(/[\d.]+/);
  return m ? parseFloat(m[0]) : null;
}

function ppm2(l) {
  const a = areaVal(l);
  if (!l.price || !a || a <= 0) return null;
  return l.price / a;
}

function ppsot(l) {
  if (!l.price || !l.land_area_sot || l.land_area_sot <= 0) return null;
  return l.price / l.land_area_sot;
}

function roomCount(l) {
  if (!l.rooms) return null;
  const m = String(l.rooms).match(/\d+/);
  return m ? parseInt(m[0]) : null;
}

function priceChange(l) {
  const h = l.price_history;
  if (!h || h.length < 2) return null;
  const prev = h[h.length - 2].price;
  const curr = h[h.length - 1].price;
  return prev === curr ? null : curr - prev;
}

function cacheKey(cat, type) { return `${cat}_${type}`; }

async function loadFile(cat, type) {
  const key = cacheKey(cat, type);
  if (cache[key]) return cache[key];
  try {
    const res = await fetch(`data/${cat}_${type}.json`);
    if (!res.ok) throw new Error(res.status);
    cache[key] = await res.json();
  } catch(e) {
    cache[key] = [];
  }
  return cache[key];
}

async function loadAll() {
  loading = true;
  renderGrid();

  const pairs = [];
  (selCat === 'all' ? CATS : [selCat]).forEach(c => {
    (FILES[c] || []).forEach(t => {
      if (selType === 'all' || selType === t) pairs.push([c, t]);
    });
  });

  allListings = (await Promise.all(pairs.map(([c,t]) => loadFile(c,t)))).flat();
  loading = false;
  buildLocationDropdown();
  applyFilters();
}

function num(id) {
  const v = parseFloat(document.getElementById(id).value);
  return isNaN(v) ? null : v;
}

function applyFilters() {
  priceMin = num('price-min'); priceMax = num('price-max');
  areaMin  = num('area-min');  areaMax  = num('area-max');
  sotMin   = num('sot-min');   sotMax   = num('sot-max');
  ppm2Min  = num('ppm2-min');  ppm2Max  = num('ppm2-max');
  roomsF   = document.getElementById('rooms-filter').value;
  repairF  = document.getElementById('repair-filter').value;

  let list = allListings;

  if (!showDel) list = list.filter(l => !l.deleted_at);

  if (selLocs.size > 0) {
    list = list.filter(l => selLocs.has(l.location || ''));
  }

  if (priceMin != null) list = list.filter(l => l.price != null && l.price >= priceMin);
  if (priceMax != null) list = list.filter(l => l.price != null && l.price <= priceMax);

  if (areaMin != null) list = list.filter(l => { const a = areaVal(l); return a != null && a >= areaMin; });
  if (areaMax != null) list = list.filter(l => { const a = areaVal(l); return a != null && a <= areaMax; });

  if (sotMin  != null) list = list.filter(l => l.land_area_sot != null && l.land_area_sot >= sotMin);
  if (sotMax  != null) list = list.filter(l => l.land_area_sot != null && l.land_area_sot <= sotMax);

  if (ppm2Min != null) list = list.filter(l => { const v = ppm2(l); return v != null && v >= ppm2Min; });
  if (ppm2Max != null) list = list.filter(l => { const v = ppm2(l); return v != null && v <= ppm2Max; });

  if (roomsF) {
    if (roomsF === '5') {
      list = list.filter(l => { const r = roomCount(l); return r != null && r >= 5; });
    } else {
      const n = parseInt(roomsF);
      list = list.filter(l => roomCount(l) === n);
    }
  }

  if (repairF === 'yes') list = list.filter(l => l.has_repair === true);
  if (repairF === 'no')  list = list.filter(l => l.has_repair === false);

  list = [...list].sort((a, b) => {
    switch (sort) {
      case 'newest':    return new Date(b.last_seen_at) - new Date(a.last_seen_at);
      case 'price_asc': return (a.price||0) - (b.price||0);
      case 'price_desc':return (b.price||0) - (a.price||0);
      case 'ppm2_asc':  return (ppm2(a)||0) - (ppm2(b)||0);
      case 'ppm2_desc': return (ppm2(b)||0) - (ppm2(a)||0);
      case 'ppsot_asc': return (ppsot(a)||0) - (ppsot(b)||0);
      case 'ppsot_desc':return (ppsot(b)||0) - (ppsot(a)||0);
      case 'area_asc':  return (areaVal(a)||0) - (areaVal(b)||0);
      case 'area_desc': return (areaVal(b)||0) - (areaVal(a)||0);
      default: return 0;
    }
  });

  filtered = list;
  page = 1;
  updateStats();
  renderGrid();
  renderPagination();
}

// ── Render ────────────────────────────────────────────────────────────────────

function renderGrid() {
  const grid = document.getElementById('grid');
  if (loading) {
    grid.innerHTML = `<div class="state-msg"><div class="spinner"></div>Yüklənir…</div>`;
    return;
  }
  const slice = filtered.slice((page-1)*PAGE_SIZE, page*PAGE_SIZE);
  if (!slice.length) {
    grid.innerHTML = `<div class="state-msg">Nəticə tapılmadı</div>`;
    return;
  }
  grid.innerHTML = slice.map(cardHTML).join('');
}

function cardHTML(l) {
  const change = priceChange(l);
  let changeBadge = '';
  if (change !== null) {
    const abs = fmt(Math.abs(change));
    changeBadge = change < 0
      ? `<span class="price-drop">↓ ${abs} ₼</span>`
      : `<span class="price-rise">↑ ${abs} ₼</span>`;
  }

  const photo = l.photo_url
    ? `<img src="${esc(l.photo_url)}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<div class=card-photo-placeholder>🏠</div>'">`
    : `<div class="card-photo-placeholder">🏠</div>`;

  // Unit price
  const m2 = ppm2(l);
  const sot = ppsot(l);
  let unitPrice = '';
  if (m2)  unitPrice = `<div class="card-unit-price">${fmt(m2)} ₼/m²</div>`;
  else if (sot) unitPrice = `<div class="card-unit-price">${fmt(sot)} ₼/sot</div>`;

  const area = areaVal(l);
  const details = [
    l.rooms || '',
    area ? `${area} m²` : '',
    l.land_area_sot ? `${l.land_area_sot} sot` : '',
  ].filter(Boolean).join(' · ');

  const badges = [
    l.has_repair ? `<span class="badge badge-repair">✓ Təmirli</span>` : '',
    l.deleted_at ? `<span class="badge badge-deleted">Silinib</span>` : '',
    selCat === 'all' ? `<span class="badge badge-cat">${catLabel(l.category)}</span>` : '',
  ].filter(Boolean).join('');

  return `
<div class="card${l.deleted_at ? ' deleted' : ''}">
  <a class="card-photo-wrap" href="${esc(l.url)}" target="_blank" rel="noopener">${photo}</a>
  <div class="card-body">
    <div class="card-price-row">
      <span class="card-price">${formatPrice(l.price, l.deal_type)}</span>
      ${changeBadge}
    </div>
    ${unitPrice}
    ${l.location ? `<div class="card-location">${esc(l.location)}</div>` : ''}
    ${details    ? `<div class="card-details">${esc(details)}</div>` : ''}
    ${badges     ? `<div class="card-badges">${badges}</div>` : ''}
  </div>
  <div class="card-footer">
    <a href="${esc(l.url)}" target="_blank" rel="noopener">🔗 bina.az</a>
    ${l.lat && l.lng ? `<a href="https://www.google.com/maps?q=${l.lat},${l.lng}" target="_blank" rel="noopener">📍 Xəritə</a>` : ''}
  </div>
</div>`;
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function catLabel(cat) {
  return {apartment:'Mənzil',house:'Həyət evi',land:'Torpaq',commercial:'Kommersiya',office:'Ofis',garage:'Qaraj'}[cat]||cat;
}

function updateStats() {
  const active = filtered.filter(l => !l.deleted_at).length;
  const total  = filtered.length;
  document.getElementById('stats-bar').textContent = showDel
    ? `${total} nəticə (${active} aktiv, ${total-active} silinmiş)`
    : `${total} aktiv elan`;
  document.getElementById('global-stats').textContent = `${allListings.length.toLocaleString()} elan yükləndi`;
}

function renderPagination() {
  const total = Math.ceil(filtered.length / PAGE_SIZE);
  const pag = document.getElementById('pagination');
  if (total <= 1) { pag.style.display = 'none'; return; }
  pag.style.display = 'flex';
  pag.innerHTML = `
    <button id="btn-prev" ${page===1?'disabled':''}>← Əvvəlki</button>
    <span>${page} / ${total}</span>
    <button id="btn-next" ${page===total?'disabled':''}>Növbəti →</button>`;
  document.getElementById('btn-prev').onclick = () => { page--; renderGrid(); renderPagination(); scrollTo({top:0,behavior:'smooth'}); };
  document.getElementById('btn-next').onclick = () => { page++; renderGrid(); renderPagination(); scrollTo({top:0,behavior:'smooth'}); };
}

  'Lökbatan q.','M.Ə.Rəsulzadə q.','Masazır q.','Mehdiabad q.','Memar Əcəmi m.',

  'Qara Qarayev m.','Qaraçuxur q.','Qobu q.','Sahil q.','Saray q.',

];

function buildLocationDropdown(searchVal = '') {
  const list = document.getElementById('ms-list');
  // Merge static list with any new locations found in loaded data
  const fromData = allListings.map(l => l.location || '').filter(Boolean);
  const locs = [...new Set([...ALL_LOCATIONS, ...fromData])].sort();
  const q = searchVal.toLowerCase();
  const visible = q ? locs.filter(l => l.toLowerCase().includes(q)) : locs;

  if (!visible.length) {
    list.innerHTML = `<div class="ms-empty">Nəticə yoxdur</div>`;
    return;
  }
  list.innerHTML = visible.map(loc => `
    <label class="ms-item">
      <input type="checkbox" value="${esc(loc)}" ${selLocs.has(loc) ? 'checked' : ''}>
      <span>${esc(loc)}</span>
    </label>`).join('');

  list.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', () => {
      if (cb.checked) selLocs.add(cb.value); else selLocs.delete(cb.value);
      updateMsLabel();
      applyFilters();
    });
  });
}

function updateMsLabel() {
  const btn = document.getElementById('ms-btn');
  const label = document.getElementById('ms-label');
  if (selLocs.size === 0) {
    label.textContent = 'Bütün məkanlar';
    btn.classList.remove('has-selection');
  } else {
    label.textContent = `${selLocs.size} məkan seçildi`;
    btn.classList.add('has-selection');
  }
}

// Toggle dropdown
document.getElementById('ms-btn').addEventListener('click', e => {
  e.stopPropagation();
  const dd = document.getElementById('ms-dropdown');
  dd.classList.toggle('open');
  if (dd.classList.contains('open')) document.getElementById('ms-search').focus();
});

// Close on outside click
document.addEventListener('click', e => {
  if (!document.getElementById('ms-wrap').contains(e.target)) {
    document.getElementById('ms-dropdown').classList.remove('open');
  }
});

// Search within dropdown
document.getElementById('ms-search').addEventListener('input', e => {
  buildLocationDropdown(e.target.value);
});

// Select all / clear
document.getElementById('ms-all').addEventListener('click', () => {
  const locs = [...new Set(allListings.map(l => l.location || '').filter(Boolean))];
  locs.forEach(l => selLocs.add(l));
  buildLocationDropdown(document.getElementById('ms-search').value);
  updateMsLabel();
  applyFilters();
});
document.getElementById('ms-none').addEventListener('click', () => {
  selLocs.clear();
  buildLocationDropdown(document.getElementById('ms-search').value);
  updateMsLabel();
  applyFilters();
});

document.getElementById('sort').addEventListener('change', e => { sort = e.target.value; applyFilters(); });
document.getElementById('show-deleted').addEventListener('change', e => { showDel = e.target.checked; applyFilters(); });

['price-min','price-max','area-min','area-max','sot-min','sot-max','ppm2-min','ppm2-max'].forEach(id => {
  document.getElementById(id).addEventListener('input', applyFilters);
});
document.getElementById('rooms-filter').addEventListener('change', applyFilters);
document.getElementById('repair-filter').addEventListener('change', applyFilters);

loadAll();

name: Scrape bina.az

# Triggered externally via workflow_dispatch (API call from a cron service).
# See README for instructions on setting up an external cron trigger.
on:
  workflow_dispatch:

jobs:
  scrape:
    name: Scrape ${{ matrix.category }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    strategy:
      fail-fast: false # keep running other categories if one fails
      matrix:
        category:
          - apartment_sale
          - apartment_rental
          - house_sale
          - house_rental
          - commercial_sale
          - commercial_rental
          - office_sale
          - office_rental
          - garage_sale
          - garage_rental
          - land_sale

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Camoufox browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/camoufox
          key: camoufox-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Fetch Camoufox browser
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m camoufox fetch

      - name: Install Xvfb
        run: sudo apt-get install -y xvfb

      - name: Scrape ${{ matrix.category }}
        run: xvfb-run --auto-servernum python -m scraper.main ${{ matrix.category }}

      - name: Upload scraped data
        uses: actions/upload-artifact@v7
        with:
          name: data-${{ matrix.category }}
          path: data/${{ matrix.category }}.json

      - name: Upload debug snapshots (if any)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debug-${{ matrix.category }}
          path: debug/
          if-no-files-found: ignore

  commit:
    name: Commit all data
    runs-on: ubuntu-latest
    needs: scrape
    if: always()
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: data-*
          path: data/
          merge-multiple: true

      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "chore: scrape all $(date -u +%Y-%m-%d)"
          git push

      - name: Delete intermediate data artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts \
            --jq '.artifacts[] | select(.name | startswith("data-")) | .id' | \
          xargs -I{} gh api --method DELETE repos/${{ github.repository }}/actions/artifacts/{}

  rerun-failed:
    name: Re-run failed jobs on new runners
    runs-on: ubuntu-latest
    needs: [scrape, commit]
    # Only auto-retry on the first attempt to avoid infinite loops
    if: always() && needs.scrape.result == 'failure' && github.run_attempt == 1
    permissions:
      actions: write
    steps:
      - name: Trigger re-run of failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/rerun-failed-jobs

  notify:
    name: Telegram summary
    runs-on: ubuntu-latest
    needs: [scrape, commit]
    # Skip on attempt 1 if there were failures — rerun-failed will trigger attempt 2
    # which will send its own notification when done.
    if: always() && (needs.scrape.result == 'success' || github.run_attempt > 1)
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send summary
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPE_RESULT: ${{ needs.scrape.result == 'success' && needs.commit.result == 'success' && 'success' || 'failure' }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/notify.py

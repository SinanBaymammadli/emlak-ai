name: Scrape bina.az

# Triggered externally via workflow_dispatch (API call from a cron service).
# See README for instructions on setting up an external cron trigger.
on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # needed to push data files back to the repo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch Camoufox browser
        run: python -m camoufox fetch

      - name: Install Xvfb
        run: sudo apt-get install -y xvfb

      - name: Run scraper
        run: xvfb-run --auto-servernum python -m scraper.main

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: scrape $(date -u +%Y-%m-%d)"
          git push

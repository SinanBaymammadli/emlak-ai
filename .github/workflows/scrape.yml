name: Scrape bina.az

# Triggered externally via workflow_dispatch (API call from a cron service).
# See README for instructions on setting up an external cron trigger.
on:
  workflow_dispatch:

jobs:
  scrape:
    name: Scrape ${{ matrix.category }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    strategy:
      fail-fast: false   # keep running other categories if one fails
      matrix:
        category:
          - apartment_sale
          - apartment_rental
          - house_sale
          - house_rental
          - commercial_sale
          - commercial_rental
          - office_sale
          - office_rental
          - garage_sale
          - garage_rental
          - land_sale

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Camoufox browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/camoufox
          key: camoufox-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Fetch Camoufox browser
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m camoufox fetch

      - name: Install Xvfb
        run: sudo apt-get install -y xvfb

      - name: Scrape ${{ matrix.category }}
        run: xvfb-run --auto-servernum python -m scraper.main ${{ matrix.category }}

      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "chore: scrape ${{ matrix.category }} $(date -u +%Y-%m-%d)"
          # Retry push with rebase — each job touches a different file so rebases are clean
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break || sleep $((i * 10))
          done

  notify:
    name: Telegram summary
    runs-on: ubuntu-latest
    needs: scrape
    if: always()
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send summary
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPE_RESULT: ${{ needs.scrape.result }}
        run: python -c "
import json, os, subprocess, urllib.request
from pathlib import Path

token = os.environ.get('TELEGRAM_TOKEN')
chat_id = os.environ.get('TELEGRAM_CHAT_ID')
if not token or not chat_id:
    print('No Telegram credentials — skipping')
    exit(0)

result = os.environ.get('SCRAPE_RESULT', 'unknown')
icon = '✅' if result == 'success' else '⚠️' if result == 'failure' else '❓'

# Find the oldest scrape commit from this run so we can diff against its parent
hashes = subprocess.check_output(
    ['git', 'log', '--format=%H', '--grep=chore: scrape', '--since=midnight'],
    text=True
).split()
base = subprocess.check_output(['git', 'rev-parse', f'{hashes[-1]}^'], text=True).strip() if hashes else None

lines = [f'{icon} <b>emlak-ai scrape complete</b> ({result})']
for f in sorted(Path('data').glob('*.json')):
    try:
        listings = json.loads(f.read_text(encoding='utf-8'))
        active_ids = {l['id'] for l in listings if l.get('deleted_at') is None}

        new_count = 0
        if base:
            try:
                old = subprocess.check_output(
                    ['git', 'show', f'{base}:data/{f.name}'],
                    text=True, stderr=subprocess.DEVNULL
                )
                old_ids = {l['id'] for l in json.loads(old) if l.get('deleted_at') is None}
                new_count = len(active_ids - old_ids)
            except subprocess.CalledProcessError:
                new_count = len(active_ids)  # file is new

        new_str = f' <b>+{new_count} new</b>' if new_count else ''
        lines.append(f'  {f.stem}: {len(active_ids)} active{new_str}')
    except Exception:
        pass

payload = json.dumps({'chat_id': chat_id, 'text': chr(10).join(lines), 'parse_mode': 'HTML'}).encode()
req = urllib.request.Request(
    f'https://api.telegram.org/bot{token}/sendMessage',
    data=payload,
    headers={'Content-Type': 'application/json'},
)
try:
    urllib.request.urlopen(req, timeout=10)
    print('Telegram notification sent')
except Exception as exc:
    print(f'Telegram notify failed: {exc}')
"

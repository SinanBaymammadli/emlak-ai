name: Scrape bina.az

# Triggered externally via workflow_dispatch (API call from a cron service).
# See README for instructions on setting up an external cron trigger.
on:
  workflow_dispatch:

jobs:
  scrape:
    name: Scrape ${{ matrix.category }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    strategy:
      fail-fast: false   # keep running other categories if one fails
      matrix:
        category:
          - apartment_sale
          - apartment_rental
          - house_sale
          - house_rental
          - commercial_sale
          - commercial_rental
          - office_sale
          - office_rental
          - garage_sale
          - garage_rental
          - land_sale

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Camoufox browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/camoufox
          key: camoufox-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Fetch Camoufox browser
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m camoufox fetch

      - name: Install Xvfb
        run: sudo apt-get install -y xvfb

      - name: Scrape ${{ matrix.category }}
        run: xvfb-run --auto-servernum python -m scraper.main ${{ matrix.category }}

      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "chore: scrape ${{ matrix.category }} $(date -u +%Y-%m-%d)"
          # Retry push with rebase — each job touches a different file so rebases are clean
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break || sleep $((i * 10))
          done

  notify:
    name: Telegram summary
    runs-on: ubuntu-latest
    needs: scrape
    if: always()
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send summary
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPE_RESULT: ${{ needs.scrape.result }}
        run: python scripts/notify.py

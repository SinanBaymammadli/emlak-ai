name: Retry failed scrape jobs

on:
  workflow_run:
    workflows: ["Scrape bina.az"]
    types: [completed]

jobs:
  retry:
    runs-on: ubuntu-latest
    # Only retry on the first attempt to avoid infinite loops
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    permissions:
      actions: write
    steps:
      - name: Re-run failed jobs on new runners
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/rerun-failed-jobs
